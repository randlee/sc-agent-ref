[package]
name = "sc-jev-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "API-direct Haiku and Luna judge backends."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Allowlist. `tests/**` ships so cargo keeps every test target (no publish
# warning); tests that read repo-root fixtures run from the workspace only.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[lints]
workspace = true

[features]
default = []
# Test seam (plan "Test seams", REQ-SAG-0606): `WireFault` and
# `with_wire_fault` on the Haiku and Luna backends. Production builds leave
# this off. The `wire` test target declares `required-features =
# ["test-util"]`; there is no self dev-dependency (boundaries/README.md
# "Dev-dependency and self edges").
test-util = []

[dependencies]
sc-agent-http.workspace = true
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.0" }
serde_json.workspace = true

[dev-dependencies]
# Test transports and retry hooks (plan "Test seams").
sc-agent-http = { workspace = true, features = ["test-util"] }
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.0", features = ["test-util"] }

[[test]]
name = "wire"
required-features = ["test-util"]
