[package]
name = "sc-jev-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Composition-root support for sc-ai and sc-jev-py (internal support crate, no semver promise)."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Allowlist. `tests/**` ships so cargo keeps every test target (no publish
# warning); tests that read repo-root fixtures run from the workspace only.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[lints]
workspace = true

[dependencies]
sc-agent-types = { path = "../sc-agent-types", version = "0.1.0" }
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.0" }
sc-jev-check = { path = "../sc-jev-check", version = "0.1.0" }
# Deliberate `=` lockstep (ADR-SAG-0023 list; ADR-SAG-0016). Only this crate
# links sc-observability.
sc-observability.workspace = true
serde_json.workspace = true

[dev-dependencies]
sc-decision-schema = { path = "../sc-decision-schema", version = "0.1.0", features = ["test-util"] }
tempfile.workspace = true
