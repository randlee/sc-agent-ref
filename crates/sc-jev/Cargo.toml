[package]
name = "sc-jev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TypeSafe Jev HTTP client."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Allowlist. `tests/**` ships so cargo keeps every test target (no publish
# warning); tests that read repo-root fixtures run from the workspace only.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[lints]
workspace = true

[dependencies]
sc-agent-http.workspace = true
sc-agent-types = { version = "0.1.0", path = "../sc-agent-types" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# Test transports and retry hooks (plan "Test seams").
sc-agent-http = { workspace = true, features = ["test-util"] }
sc-agent-types = { version = "0.1.0", path = "../sc-agent-types", features = ["test-util"] }
