manifest_message = "Only sc-agent-types may depend on ulid: SessionId and AnswerId are its core types (ADR-SAG-0008 and ADR-SAG-0027 r-6 amendments)."
source_message = "Only sc-agent-types may depend on ulid: SessionId and AnswerId are its core types (ADR-SAG-0008 and ADR-SAG-0027 r-6 amendments)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
