manifest_message = "Only sc-jev-host may depend on full sc-observability; sc-ai and sc-jev-py are thin adapters over it (ADR-SAG-0016 r-3b amendment)."
source_message = "Only sc-jev-host may depend on full sc-observability; sc-ai and sc-jev-py are thin adapters over it (ADR-SAG-0016 r-3b amendment)."

