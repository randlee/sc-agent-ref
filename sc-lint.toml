# Managed by sc-lint; regenerate with `sc-lint init --just`.
[tool.sc-lint]
minimum_version = "0.8.0"

[[tool.sc-lint.lint]]
name = "boundary"
command = ["sc-lint", "lint", "sc-boundary", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "fmt"
command = ["cargo", "fmt", "--all", "--check"]

[[tool.sc-lint.lint]]
name = "clippy"
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[[tool.sc-lint.test]]
name = "workspace"
command = ["cargo", "test", "--workspace"]

# sc-jev-py Python harness: maturin develop (extension-module,test-util) into a
# venv, then tests/fixtures/jev-python pytest. Commands are argv-only, so the
# multi-step recipe lives in the justfile. Needs Python 3.11+ on PATH.
[[tool.sc-lint.test]]
name = "jev-python"
command = ["just", "test-python"]

# Third-party dependency ownership (SCB-MANIFEST-004). sc-boundary enforces
# only workspace-to-workspace edges from boundaries/**; these records make the
# third-party edges in each manifest's forbidden_edges mechanical. Each record
# checks direct manifest declarations and `use` paths under the allowed crate
# directories. Keep in sync with boundaries/*/*.toml allowed_dependencies.
# These records, the jev-python test layer and the justfile test-python recipe
# are hand-added: `sc-lint init --just` regeneration would drop them, so
# re-apply them after regenerating.

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "ureq"
allowed_manifest_paths = ["crates/sc-agent-http/Cargo.toml"]
allowed_source_roots = ["crates/sc-agent-http"]
manifest_message = "Only sc-agent-http may depend on ureq (ADR-SAG-0026 HTTP half, r-3); sc-jev and sc-jev-backends are wire-format crates on sc-agent-http, and every other crate stays HTTP-free (ADR-SAG-0010, RBQA-F002)."
source_message = "Only sc-agent-http may depend on ureq (ADR-SAG-0026 HTTP half, r-3); sc-jev and sc-jev-backends are wire-format crates on sc-agent-http, and every other crate stays HTTP-free (ADR-SAG-0010, RBQA-F002)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "pyo3"
allowed_manifest_paths = ["crates/sc-jev-py/Cargo.toml"]
allowed_source_roots = ["crates/sc-jev-py"]
manifest_message = "Only sc-jev-py may depend on pyo3 (ADR-SAG-0011)."
source_message = "Only sc-jev-py may depend on pyo3 (ADR-SAG-0011)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "tree-sitter"
allowed_manifest_paths = ["crates/sc-treesitter/Cargo.toml"]
allowed_source_roots = ["crates/sc-treesitter"]
manifest_message = "Only sc-treesitter may depend on tree-sitter; sc-jev-check links no grammar crate (ADR-SAG-0015)."
source_message = "Only sc-treesitter may depend on tree-sitter; sc-jev-check links no grammar crate (ADR-SAG-0015)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "tree-sitter-python"
allowed_manifest_paths = ["crates/sc-treesitter/Cargo.toml"]
allowed_source_roots = ["crates/sc-treesitter"]
manifest_message = "Only sc-treesitter may depend on tree-sitter-python (ADR-SAG-0015)."
source_message = "Only sc-treesitter may depend on tree-sitter-python (ADR-SAG-0015)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "tree-sitter-rust"
allowed_manifest_paths = ["crates/sc-treesitter/Cargo.toml"]
allowed_source_roots = ["crates/sc-treesitter"]
manifest_message = "Only sc-treesitter may depend on tree-sitter-rust (ADR-SAG-0015)."
source_message = "Only sc-treesitter may depend on tree-sitter-rust (ADR-SAG-0015)."

[[tool.sc-lint.analyzers.boundary.global_dependency_ownership]]
dependency = "ulid"
