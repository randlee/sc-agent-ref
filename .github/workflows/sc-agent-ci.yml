# Consumer-owned CI for the sc-agent workspace (QA-001, FTQ-001, REQ-QA-003,
# REQ-QA-004). Not a kit file: install.py never writes this path. The release
# surface is checked separately by sc-publish-dry-run.yml.
#
# Jobs and their local equivalents (docs/development/ci.md):
#   test      just setup + just lint (ubuntu only); cargo clippy --all-features
#             and cargo test (all three OSes)
#   python    just test-python (maturin develop + jev-python pytest)
#   features  cargo hack --each-feature test -p sc-treesitter;
#             cargo test --test cli --features cli for sc-treesitter and sc-ai;
#             cargo hack check -p sc-agent-types --feature-powerset --no-dev-deps
#             cargo hack check -p sc-decision-schema --feature-powerset --no-dev-deps
#   deps      cargo build --lib --no-default-features for sc-treesitter and
#             sc-ai; one isolated `cargo build -p <lib> --lib` per library;
#             .github/scripts/cargo-tree-gates.sh (REQ-SAG-0134, REQ-SAG-0135);
#             .github/scripts/check-exact-pins.sh and its --self-test
#             (NFR-SAG-0004, ADR-SAG-0023)
#   wheel     default `maturin build` of sc-jev-py: the release wheel has no
#             `_testing` submodule (ADR-SAG-0029 (b))
#   workspace-tests  cargo test -p workspace-tests (cross-crate proofs,
#             ADR-SAG-0028)
#   doc       cargo doc --workspace --no-deps with RUSTDOCFLAGS=-D warnings
#   coverage  cargo llvm-cov summary, uploaded as an artifact
#
# Determinism: every action is pinned to a commit SHA, the runner images,
# toolchain, Python (exact patch), maturin, just and cargo tools are exact,
# Python tools install from a hash-pinned lock, and every step has a timeout.
# No step retries; bounded cargo network-fetch retries only (CARGO_NET_RETRY).
name: sc-agent CI

on:
  pull_request:
  push:
    branches:
      - develop
      - "integrate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.1"
  # Exact patch: the newest 3.11 that actions/python-versions ships for
  # ubuntu-24.04, macos-15 (arm64) and windows-2022.
  PYTHON_VERSION: "3.11.9"
  JUST_VERSION: "1.58.0"
  CARGO_HACK_VERSION: "0.6.46"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "2"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # sc-lint's bootstrap and the sc-jev-py test binary (libpython) need it.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # just setup / just lint run on ubuntu only: sc-boundary, fmt and clippy
      # results do not depend on the host, and the managed sc-lint bootstrap
      # fails to activate on Windows (docs/development/ci.md, Known limits).
      - name: Install just
        if: matrix.os == 'ubuntu-24.04'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        timeout-minutes: 5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-test-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-test-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # Warm the cache for every platform: sc-agent-types' tests/features.rs
      # runs `cargo tree --locked --offline --target all`, which needs the
      # platform-only crates in Cargo.lock downloaded (no --target here).
      - name: cargo fetch --locked (all targets)
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: just setup (checksum-verified sc-lint)
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 5
        run: just setup

      - name: just lint (sc-boundary, fmt, clippy)
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 20
        run: just lint

      - name: cargo clippy --all-features
        timeout-minutes: 20
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace
        timeout-minutes: 30
        run: cargo test --locked --workspace

      # r-1 D0: sc-agent-types' `git` target declares required-features, so
      # the workspace run skips it. r-7: `mock` moved to sc-decision-schema.
      - name: cargo test -p sc-agent-types --features git
        timeout-minutes: 15
        run: cargo test --locked -p sc-agent-types --features git

      - name: cargo test -p sc-decision-schema --features test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-decision-schema --features test-util

      - name: cargo test -p sc-jev-check --features test-util
        timeout-minutes: 20
        run: cargo test --locked -p sc-jev-check --features test-util

      - name: cargo test -p sc-jev --features test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-jev --features test-util

      - name: cargo test -p sc-jev-backends --features test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-jev-backends --features test-util

      # r-3 (FTQ-002): sc-agent-http's `retry` and `ureq` targets declare
      # required-features = ["test-util"]; run them explicitly instead of
      # relying on feature unification through other crates' dev-deps.
      - name: cargo test -p sc-agent-http --features test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-agent-http --features test-util

      # r-3b (D3): sc-ai's `cli` target needs the hidden --scripted-answers
      # flag, present only with `test-util`; `argv` runs the cli binary.
      - name: cargo test -p sc-ai --features test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-ai --features test-util

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        timeout-minutes: 5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-python-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-python-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # Python 3.11.9 venv; maturin 1.16.0 and pytest 8.4.2 from the hash-pinned
      # tests/fixtures/jev-python/constraints.txt; `maturin develop --features
      # extension-module,test-util -m crates/sc-jev-py/Cargo.toml`; then
      # `pytest tests/fixtures/jev-python -q`. The venv lives in RUNNER_TEMP
      # (outside the cached target/) and is recreated each run.
      - name: maturin develop + pytest (just test-python)
        timeout-minutes: 30
        env:
          JEV_VENV: ${{ runner.temp }}/jev-python-venv
        run: just test-python

  features:
    name: sc-treesitter feature matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        timeout-minutes: 5
        with:
          tool: cargo-hack@${{ env.CARGO_HACK_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-features-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-features-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo hack --each-feature test -p sc-treesitter
        timeout-minutes: 20
        run: cargo hack --each-feature test --locked -p sc-treesitter

      # The `cli` test targets are gated on `required-features = ["cli"]`, so
      # the hack cells without `cli` skip them on purpose. Naming the feature
      # here makes cargo fail if the target or the feature is renamed or
      # dropped, instead of silently skipping the CLI tests.
      - name: cargo test -p sc-treesitter --test cli --features cli
        timeout-minutes: 15
        run: cargo test --locked -p sc-treesitter --test cli --features cli

      - name: cargo test -p sc-ai --test cli --features cli,test-util
        timeout-minutes: 15
        run: cargo test --locked -p sc-ai --test cli --features cli,test-util

      - name: cargo test -p sc-ai --test argv --features cli
        timeout-minutes: 15
        run: cargo test --locked -p sc-ai --test argv --features cli

      # The two powerset steps cannot take `--locked`: `--no-dev-deps` rewrites
      # the real Cargo.toml while cargo-hack runs, which makes Cargo update the
      # lock file, and `--locked` then fails (verified). Cargo.lock is still
      # checked by every other step in this job.
      - name: cargo hack check -p sc-agent-types --feature-powerset
        timeout-minutes: 20
        run: cargo hack check -p sc-agent-types --feature-powerset --no-dev-deps

      - name: cargo hack check -p sc-decision-schema --feature-powerset
        timeout-minutes: 20
        run: cargo hack check -p sc-decision-schema --feature-powerset --no-dev-deps

  deps:
    name: dependency gates (allocator, pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # check-exact-pins.sh parses Cargo.toml with tomllib (Python 3.11+).
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-deps-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-deps-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # REQ-SAG-0134: the libraries build without the binaries' `cli` feature.
      - name: cargo build -p sc-treesitter --lib --no-default-features
        timeout-minutes: 15
        run: cargo build --locked -p sc-treesitter --lib --no-default-features

      - name: cargo build -p sc-ai --lib --no-default-features
        timeout-minutes: 15
        run: cargo build --locked -p sc-ai --lib --no-default-features

      # r-3b: one invocation per library crate, so Cargo feature unification
      # across the workspace cannot hide a missing dependency edge or a seam
      # that only builds because another member enabled it.
      - name: isolated library builds
        timeout-minutes: 20
        run: |
          for p in sc-agent-types sc-decision-schema sc-agent-secrets sc-agent-http sc-jev sc-jev-backends sc-jev-check sc-jev-host; do
            cargo build --locked -p "$p" --lib
          done

      - name: cargo tree gates
        timeout-minutes: 10
        run: bash .github/scripts/cargo-tree-gates.sh

      # r-3 (RBQA-F101): no ureq type in sc-agent-http's public API. Built
      # WITH deps so a leaked type renders as a link into ureq's docs; fails
      # on any href into ureq/ or any `ureq::` item title. Proven by the
      # `pub fn _canary() -> ureq::Agent` run in the r-3 sprint doc.
      - name: sc-agent-http public API has no ureq type
        timeout-minutes: 15
        run: |
          rm -rf target/doc/sc_agent_http
          cargo doc --locked -p sc-agent-http
          if grep -rlE 'href="[^"]*ureq/|title="[a-z]+ ureq::' target/doc/sc_agent_http/; then
            echo "ureq type in the sc-agent-http public API" >&2
            exit 1
          fi

      # ADR-SAG-0020 r-3 read-site convention: from r-3b the cross-crate proof
      # is `workspace-tests --test source_scans` (job `workspace-tests`); it
      # replaces r-3's local grep, which flagged every legitimate process-spawn
      # expect.

      # NFR-SAG-0004: every `=` pin is on the ADR-SAG-0023 lockstep list.
      # Re-run now that the intra-workspace `=` sc-jev-host pin exists.
      - name: check-exact-pins
        timeout-minutes: 5
        run: bash .github/scripts/check-exact-pins.sh

      - name: check-exact-pins --self-test
        timeout-minutes: 5
        run: bash .github/scripts/check-exact-pins.sh --self-test

  wheel:
    name: release wheel has no _testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-wheel-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-wheel-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # The default `maturin build` is the publish shape: no `test-util`, so
      # no `_testing` submodule (ADR-SAG-0029 (b)). maturin installs from the
      # hash-pinned lock the pytest job uses.
      - name: maturin build (release shape) and import check
        timeout-minutes: 25
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --require-hashes -r tests/fixtures/jev-python/constraints.txt
          "$RUNNER_TEMP/wheel-venv/bin/maturin" build -m crates/sc-jev-py/Cargo.toml -o "$RUNNER_TEMP/wheels"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/wheels/sc_jev_py-*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import sc_jev_py, sys; sys.exit(1 if hasattr(sc_jev_py, "_testing") else 0)'

  workspace-tests:
    name: workspace-tests (cross-crate proofs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-workspace-tests-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-workspace-tests-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # test_util_off runs `cargo tree --locked --offline` over the whole
      # workspace, which needs every crate in Cargo.lock downloaded.
      - name: cargo fetch --locked (all targets)
        timeout-minutes: 10
        run: cargo fetch --locked

      # Builds sc-ai and sc-treesitter in release shape under
      # target/workspace-tests-bin (support/bin_path.rs).
      - name: cargo test -p workspace-tests
        timeout-minutes: 40
        run: cargo test --locked -p workspace-tests

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-doc-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-doc-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo doc --workspace --no-deps
        timeout-minutes: 20
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        timeout-minutes: 5
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sc-agent-ci-coverage-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sc-agent-ci-coverage-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # Warm the cache for every platform: sc-agent-types' tests/features.rs
      # runs `cargo tree --locked --offline --target all`, which needs the
      # platform-only crates in Cargo.lock downloaded (no --target here).
      - name: cargo fetch --locked (all targets)
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: cargo llvm-cov (run tests, no report)
        timeout-minutes: 30
        run: cargo llvm-cov --locked --workspace --no-report

      - name: Coverage summary
        timeout-minutes: 5
        run: |
          mkdir -p coverage
          # Default text report = per-file summary table plus TOTAL line.
          cargo llvm-cov report --locked | tee coverage/summary.txt
          cargo llvm-cov report --locked --json --summary-only --output-path coverage/summary.json
          {
            echo '## Coverage (cargo-llvm-cov)'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The summary stays in this run's artifacts; nothing is sent to a
      # third-party coverage service.
      - name: Upload coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: coverage-summary
          path: coverage/
          if-no-files-found: error
          retention-days: 14
