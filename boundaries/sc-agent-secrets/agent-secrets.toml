# Boundary manifest for sc-agent-secrets. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-agent-secrets/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-agent-secrets"
owner_package = "sc-agent-secrets"
owner_crate_path = "sc_agent_secrets"
name = "agent-secrets"

[public]
facade = "sc_agent_secrets::resolve_key, sc_agent_secrets::resolve_key_with, sc_agent_secrets::resolve_key_logged, sc_agent_secrets::resolve_key_with_logged, sc_agent_secrets::EnvSource, sc_agent_secrets::KeyringSource, sc_agent_secrets::ProcessEnv, sc_agent_secrets::PlatformKeyring, sc_agent_secrets::ResolvedApiKey, sc_agent_secrets::TYPESAFE_API_KEY_VAR, sc_agent_secrets::ANTHROPIC_API_KEY_VAR, sc_agent_secrets::ANTHROPIC_KEYCHAIN_SERVICE_VAR, sc_agent_secrets::OPENAI_API_KEY_VAR"
notes = "Resolve API keys from process env, repo-root .env, then the platform keyring. The crate has no Cargo features; the MapEnv / MapKeyring doubles are cfg(test) crate-private code and are not exported (ADR-SAG-0029). Keys are built only through ResolvedApiKey::try_new. The *_logged functions report the credential source (env, dotenv or keyring) and the variable name to a GeneralLog, never the value."

[implementation]
type = "marker"
module = "sc_agent_secrets"
visibility = "public"
constructor = "none"

[composition]
roots = ["resolve_key"]

[dependencies]
allowed_dependents = ["sc-jev-check"]
allowed_dependencies = ["keyring", "sc-agent-types", "whoami"]
forbidden_edges = [
    { from = "sc-agent-secrets", to = "ureq" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. None listed: this crate has no Cargo features, and its
# MapEnv / MapKeyring doubles are cfg(test) crate-private code (ADR-SAG-0029).
[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
