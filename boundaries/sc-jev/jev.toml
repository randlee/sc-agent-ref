# Boundary manifest for sc-jev. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-jev/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-jev"
owner_package = "sc-jev"
owner_crate_path = "sc_jev"
name = "jev"

[public]
facade = "sc_jev::JevClient, sc_jev::JevClientConfig"
notes = "TypeSafe check/judge wire format (every Jev API operation, ADR-SAG-0012). From r-3 HTTP, busy retry, caps and redaction are sc-agent-http: JevClient<T: sc_agent_http::Transport = UreqTransport>; transport, resolved key, BusyPolicy and CancelToken are construction state. Tests use the sc-agent-http test-util doubles through the dev-dependency. The config and client modules are private; the root re-exports are the only public path. Non-default `test-util` feature (REQ-SAG-0606): `WireFault` and `with_wire_fault` seed a defect into the wire builder; the `wire` test target declares `required-features = [test-util]` and is run with `--features test-util` (no self dev-dependency). Each sending backend sets `JudgeOutcome::input_sha256` from the canonical blob recovered from its final wire body."

[implementation]
type = "marker"
module = "sc_jev"
visibility = "public"
constructor = "public"

[composition]
roots = ["JevClient"]

[dependencies]
allowed_dependents = ["sc-jev-check"]
allowed_dependencies = ["sc-agent-http", "sc-agent-types", "sc-decision-schema", "serde", "serde_json", "toml"]
forbidden_edges = [
    { from = "sc-jev", to = "sc-jev-backends" },
    { from = "sc-jev", to = "ureq" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. Paths name the feature-gated (`test-util`) test doubles.
[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
