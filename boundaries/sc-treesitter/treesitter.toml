# Boundary manifest for sc-treesitter. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-treesitter/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-treesitter"
owner_package = "sc-treesitter"
owner_crate_path = "sc_treesitter"
name = "treesitter"

[public]
facade = "sc_treesitter::extract, sc_treesitter::ExtractInput, sc_treesitter::language, sc_treesitter::languages, sc_treesitter::LanguageInfo, sc_treesitter::queries, sc_treesitter::query_source, sc_treesitter::QueryInfo, sc_treesitter::subjects_to_json_bytes, sc_treesitter::PRODUCER_NAME, sc_treesitter::PRODUCER_MODE"
notes = "Subjects producer; library plus the sc-treesitter binary (src/main.rs, clap parser in src/cli/). Stdout is sc/subjects/1 JSON. Links no judge, secrets or HTTP crate (docs/sc-treesitter/architecture.md, ADR-SAG-0015). sc-agent-types is a default-features = false dependency: the library uses only its always-on error, ids, envelope and schema modules; the sc-agent-types git feature is enabled only by this crate's cli feature (binary git reads, RBQA-F006). clap and mimalloc are optional, behind cli (ADR-SAG-0023)."

[implementation]
type = "marker"
module = "sc_treesitter"
visibility = "public"
constructor = "none"

[composition]
roots = ["extract"]

[dependencies]
allowed_dependents = []
# `clap` and `mimalloc` are optional (feature `cli`, binary only); r-3c
# records them here, closing the r-4 deferral (CPR-M212).
allowed_dependencies = ["clap", "mimalloc", "sc-agent-types", "serde_json", "tree-sitter", "tree-sitter-python", "tree-sitter-rust"]
forbidden_edges = [
    { from = "sc-treesitter", to = "sc-jev" },
    { from = "sc-treesitter", to = "sc-jev-backends" },
    { from = "sc-treesitter", to = "sc-jev-check" },
    { from = "sc-treesitter", to = "sc-agent-secrets" },
    { from = "sc-treesitter", to = "ureq" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. Paths name the feature-gated (`test-util`) test doubles.
[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
