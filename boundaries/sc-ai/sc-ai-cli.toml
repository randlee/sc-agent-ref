# Boundary manifest for sc-ai. Checked by `sc-lint lint sc-boundary` (`just lint`).
#
# Conventions (Phase A phase-end, RBQA-F001 option B):
# - `allowed_dependencies` lists EVERY direct normal (non-dev) dependency in
#   crates/sc-ai/Cargo.toml, workspace and third-party, including optional and
#   target-specific ones. Dev-dependencies are not listed.
# - `forbidden_edges` are direct edges only; transitive reachability is not
#   checked.
# - What sc-lint 0.8.0 enforces from this file: workspace-to-workspace edges
#   (SCB-DEPENDENCY-001 unlisted edge, -002 unlisted dependent, -003 forbidden
#   edge present, -004 stale dependent permission). Third-party names here are
#   accepted but not enforced by sc-boundary; the third-party edges that matter
#   are enforced by the `global_dependency_ownership` records in sc-lint.toml
#   (SCB-MANIFEST-004). Enforcement is Cargo-edge only: sc-lint 0.8.0 accepts
#   `references.forbidden` entries but does not report on them, so this file
#   declares none.

boundary_id = "BOUNDARY-sc-ai-cli"
owner_package = "sc-ai"
owner_crate_path = "sc_ai"
name = "sc-ai-cli"

[public]
facade = "sc_ai::execute, sc_ai::Command, sc_ai::RunCommand, sc_ai::AskCommand, sc_ai::Output"
notes = "Thin argv adapter: clap parses argv into a typed Command (bin-private src/cli.rs, behind the default cli feature), sc_ai::execute runs it through sc-jev-host (observability adapter, path policy, repo discovery, run/ask wiring) and prints the versioned envelope. A partial multi-backend failure prints the envelope on stdout, the first failure on stderr and exits 2. No HTTP client in this crate (ADR-SAG-0010). Feature test-util (= sc-jev-check/test-util) adds the hidden --scripted-answers flag to the binary only; the cli test target declares [[test]] required-features = [cli, test-util] and the argv target [cli] (no self dev-dependency, boundaries/README.md D0 outcome 4). The a-10 execute_with_overrides seam is gone."

[implementation]
type = "marker"
module = "sc_ai"
visibility = "public"
constructor = "none"

[composition]
roots = ["execute"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["clap", "mimalloc", "sc-agent-types", "sc-jev-check", "sc-jev-host", "serde", "serde_json"]
forbidden_edges = [
    { from = "sc-ai", to = "ureq" },
    { from = "sc-ai", to = "sc-jev" },
    { from = "sc-ai", to = "sc-jev-backends" },
    { from = "sc-ai", to = "sc-observability" },
]

# Required by the sc-lint 0.8.0 inventory schema. Not enforced: the
# validator accepts entries here but reports nothing for them.
[references]
scope = "outside_owner_crate"
forbidden = []

# Required by the schema. Declarative: sc-lint 0.8.0 reports nothing for
# these fields. Paths name the feature-gated (`test-util`) test doubles.
[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

# The sc-lint rules that check this boundary on every `just lint`. Listing
# them here is documentation; sc-lint 0.8.0 does not read this field.
[enforcement]
lint_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-DEPENDENCY-003", "SCB-DEPENDENCY-004", "SCB-MANIFEST-004"]
review_gates = []

[status]
state = "concrete_landed"
