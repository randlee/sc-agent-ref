# Cursor orchestration default models for Task spawns.
#
# Read from `.cursor/` skills, commands, and agents only (cursor-orchestration).
# Pass `model:` explicitly on each Task spawn.
#
# Precedence:
#   1. User-named model override for a role
#   2. Entry in this file
#   3. Agent frontmatter default (avoid — prefer explicit Task model)
#
# Contextual overrides (e.g. phase-ending review) stay in cursor-orchestration
# prose, not in this table.
#
# QA reviewers: use normal-tier models only (no *-high, *-max, or xhigh on Task spawns).

version: 1

agents:
  rust-developer:
    model: grok-4.7-high-fast
    alternates:
      - composer-2.5-fast
    notes: Implement/fix loops; default grok unless user prefers composer

  cursor-quality-mgr:
    model: composer-2.5-fast
    notes: QA enforcer only — verify spawn proof, aggregate fenced JSON, publish PR report; no Task spawns

  req-qa:
    model: composer-2.5-fast
    notes: Structured deliverable checklist

  arch-qa:
    model: gpt-5.6-sol-medium
    notes: Structural/boundary gate; normal tier (avoid high/max on QA spawns)

  extensibility-qa:
    model: gpt-5.6-sol-medium
    notes: Adversarial multi-consumer review; QA-1 and plan review only — skip on round_limit

  ceremony-qa:
    model: composer-2.5-fast
    notes: Plan/sprint doc ceremony review only; input contract in `.claude/agents/ceremony-qa.md`

  ruthless-boundary-qa:
    model: gpt-5.6-sol-medium
    notes: Boundary discipline; QA-1 and plan QA-1 per quality-policy

  rust-qa-agent:
    model: gpt-5.6-terra-medium
    notes: Normal QA rounds; see phase-ending override in cursor-quality-mgr.md (terra medium, not high/max)

  rust-best-practices-agent:
    model: composer-2.5-fast
    notes: Practice-id sweeps

  rust-service-hardening-agent:
    model: composer-2.5-fast
    notes: Often fast-exit / checklist

  flaky-test-qa:
    model: composer-2.5-fast
    notes: Narrow flaky-test contract

