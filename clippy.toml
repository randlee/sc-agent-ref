# Workspace clippy configuration.

# ADR-SAG-0020 r-3 amendment: a lint-enforced workspace convention, not a
# type seal. The one call site of `ResolvedApiKey::as_str` is
# crates/sc-agent-http/src/ureq_transport.rs, which carries
# `#[expect(clippy::disallowed_methods, reason = ...)]`. Root Cargo.toml
# denies `allow_attributes` and `allow_attributes_without_reason`, so any
# second site needs a visible `#[expect]`.
# `allow-invalid`: a package built without sc-agent-types' `secret` feature
# (sc-treesitter, `default-features = false`) cannot reach the path, and
# clippy would warn that the entry is invalid; the `--all-features` workspace
# clippy still enforces it (r-3c QA-001).
disallowed-methods = [
    { path = "sc_agent_types::ResolvedApiKey::as_str", allow-invalid = true, reason = "ADR-SAG-0020: the secret is read only by sc-agent-http's UreqTransport; send it as an sc_agent_http::SecretHeader, compare with SecretHeader::matches in tests" },
    { path = "std::process::Command::new", reason = "ADR-SAG-0028: every process spawn is visible. Production sites are sc_agent_types::git and the extractor (crates/sc-jev-check/src/extract/command.rs); a test helper that spawns carries an item-level #[expect(clippy::disallowed_methods, reason = ...)] naming the process spawn. workspace-tests --test source_scans checks the sites" },
]
